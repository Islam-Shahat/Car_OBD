[package]
name = "obd-diagnose"
version = "0.9.0-rc.1"
description = "Offline-first OBD-II diagnostic scanner for Windows"
authors = ["Islam Shahat"]
repository = "https://github.com/Islam-Shahat/Car_OBD"
edition = "2024"
rust-version = "1.90"

[lib]
name = "obd_diagnose_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.10"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com"] }

# The Rust side stays deliberately thin: it only owns the COM-port bridge.
# Every piece of OBD/ELM327 logic lives in the TypeScript layer.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
